name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PLUGIN_FOLDER: com.nocture.prvitals.sdPlugin
      PACKAGE: dist/com.nocture.prvitals.streamDeckPlugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No npm cache here: the release build takes nothing from an earlier run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Stop when the tag and the manifest version differ
        run: test "$(node -p "require('./$PLUGIN_FOLDER/manifest.json').Version")" = "${GITHUB_REF_NAME#v}.0"
      - run: npm ci
      - run: npm run check
      - run: npx streamdeck pack "$PLUGIN_FOLDER" --output dist --force --no-update-check
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}
      - run: gh release create "$GITHUB_REF_NAME" "$PACKAGE" --draft --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
