name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Stop when a generated file is out of date
        run: |
          npm run profiles
          npm run readme-images
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Run npm run profiles and npm run readme-images, then commit the changed files."
            exit 1
          fi
